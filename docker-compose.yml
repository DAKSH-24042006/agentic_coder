version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - MYSQL_SERVER=mysql
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpass
      - MYSQL_DB=ai_coder_platform
      # Point to local vLLM endpoint instance (change as appropriate for GPU servers)
      - VLLM_API_URL=http://host.docker.internal:8000/v1
    volumes:
      # Enable Docker sandbox control from within the API container (Docker-out-of-Docker)
      - /var/run/docker.sock:/var/run/docker.sock
      - backend_logs:/workspace/logs
    depends_on:
      - qdrant
      - mysql
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - enterprise_network

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - enterprise_network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpass
      - MYSQL_DATABASE=ai_coder_platform
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - enterprise_network

volumes:
  qdrant_data:
  mysql_data:
  backend_logs:

networks:
  enterprise_network:
    driver: bridge
